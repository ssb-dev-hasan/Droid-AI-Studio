name: Build Droid AI Studio & Android App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-studio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies and build Studio
        run: |
          npm ci
          npm run build
